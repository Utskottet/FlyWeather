name = "flyweather-admin-experiment"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"

# Created via: wrangler kv namespace create SITE_DRAFTS
#              wrangler kv namespace create SITE_DRAFTS --preview
# Fill in the ids below after running those commands (not needed for
# `wrangler dev`, which falls back to a local in-memory/persisted store
# when a namespace id is a placeholder).
[[kv_namespaces]]
binding = "SITE_DRAFTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"
