name: Deploy Publishing Worker

# The website deploys itself on every push; the Worker used to need a
# manual `npm run worker:deploy` from a machine that had run `wrangler
# login`. That asymmetry is a trap: a fix committed to editor-worker/
# looks shipped, passes CI, and is not actually running anywhere.
#
# Note the src/domain paths below. The Worker bundles the production
# schema and the YAML merge, so a change to either is a change to the
# Worker even though nothing under editor-worker/ was touched.
on:
  push:
    branches: [main]
    paths:
      - "editor-worker/**"
      - "src/domain/siteYaml.ts"
      - "src/domain/siteFile.ts"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel a running one - a half-applied
# Worker deploy is worse than a slightly stale one.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Worker decides what may be written to the site catalogue, so
      # its own rules are verified before it is allowed to ship - unlike
      # the weather refresh, where the code is not changing.
      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Test
        run: npm run test

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config editor-worker/wrangler.toml

      # Secrets are NOT set here. They are configured once with `wrangler
      # secret put` and persist across deploys, so the GitHub Actions
      # environment never needs to hold the GitHub token, the operator
      # password, or the session key.
      - name: Confirm the deployed Worker answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://startvind-editor.startvind.workers.dev/api/health)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Worker did not answer after deploying."
          exit 1
