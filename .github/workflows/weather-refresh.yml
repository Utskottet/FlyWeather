name: Weather Refresh

# Near-live data refresh (§13): rebuilds and redeploys on a schedule so
# public/generated/live.json, forecast-sites.json, and
# forecast-wind-grid.json all stay current, without a commit per run -
# GitHub Actions' own scheduling has no strict-timing guarantee and can
# be delayed under load, so this is "near-live," not guaranteed
# telemetry (§13). Forecast/wind-grid data used to be fetched directly
# from every visitor's browser; that's what runs here now instead,
# since per-visitor fetching tripped Open-Meteo's real rate limit under
# live traffic (see docs/DECISIONS.md's "production regression" entry).
on:
  # GitHub's own scheduler is unreliable at this frequency: measured over
  # 48 hours this "*/5" cron produced 15 runs, at gaps of 117 to 318
  # minutes (docs/PUBLISHING.md). It is kept because it is free and it does
  # fire, but it is no longer the only trigger.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # The reliable path: the Cloudflare Worker's own cron dispatches this
  # event every 30 minutes (editor-worker/wrangler.toml's [triggers]), so
  # the published forecast stops going hours stale whenever GitHub feels
  # like skipping a schedule. The event name is shared with
  # editor-worker/src/dispatch.ts (REFRESH_EVENT_TYPE) - renaming it in one
  # place and not the other silently turns the refresh off.
  repository_dispatch:
    types: [refresh-weather]

permissions:
  contents: read
  pages: write
  id-token: write

# Only the freshest refresh matters - if one run is still building when
# the next one starts, cancel the older one rather than let both finish
# (§32: "use concurrency so old overlapping refresh jobs are cancelled").
concurrency:
  group: weather-refresh
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No separate lint/typecheck/test steps here - the code isn't
      # changing between refresh runs, only the collected live data.
      # `npm run build` already re-runs validate:sites + collect:live
      # (§13.1: "keep the collector fast," avoid unnecessary work).
      - name: Build (validates site catalogue, collects fresh live data, builds app)
        run: npm run build
        env:
          VITE_SOARING_BASE_URL: https://utskottet.github.io/FlyWeather-Soaring
          # Address of the publishing Worker, not a secret - a repository
          # variable so it can be set from the GitHub UI. Set in BOTH deploy
          # workflows: weather-refresh.yml redeploys the whole site every 5
          # minutes, so if only pages.yml had it, publishing would switch
          # itself off again within the next refresh.
          VITE_EDITOR_API_URL: ${{ vars.VITE_EDITOR_API_URL }}
          # Same reasoning as VITE_EDITOR_API_URL above: this workflow
          # rebuilds and redeploys the entire site every 5 minutes, so any
          # build-time setting missing here is switched back off within
          # minutes of pages.yml setting it.
          VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_ANALYTICS_TOKEN: ${{ vars.VITE_ANALYTICS_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
