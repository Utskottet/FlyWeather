name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Observation rows are data the site does not read at build time, and
    # observations.yml appends to them several times a day. Rebuilding and
    # redeploying the whole site for each of those would be pure waste.
    # The recorder's default GITHUB_TOKEN already cannot trigger this
    # workflow; this keeps that true if it is ever changed to a PAT.
    paths-ignore:
      - "data/observations/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deployments queue rather than cancel each other - a push-triggered
# deploy should never be interrupted mid-build. weather-refresh.yml uses
# its own separate concurrency group so refresh runs can cancel each
# other without touching this one.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (validates site catalogue, collects live data, builds app)
        run: npm run build
        env:
          VITE_SOARING_BASE_URL: https://utskottet.github.io/FlyWeather-Soaring
          # Address of the publishing Worker, not a secret - a repository
          # variable so it can be set from the GitHub UI. Set in BOTH deploy
          # workflows: weather-refresh.yml redeploys the whole site every 5
          # minutes, so if only pages.yml had it, publishing would switch
          # itself off again within the next refresh.
          VITE_EDITOR_API_URL: ${{ vars.VITE_EDITOR_API_URL }}
          # Visitor counting stays off until these two repository
          # variables are set (Settings -> Secrets and variables ->
          # Actions -> Variables). Variables, not secrets: both
          # supported providers publish this token in the page source,
          # so it is not confidential - and a variable can be set from
          # the GitHub UI without a code change. Unset is supported and
          # means no analytics script is injected at all.
          VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
          VITE_ANALYTICS_TOKEN: ${{ vars.VITE_ANALYTICS_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
