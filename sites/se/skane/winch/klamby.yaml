description: >-
  CPS.se klubbfält (winch site). Private field, contact CPS. Real usable
  wind band is a single site-supplied range: green 0-5 m/s, orange 5-6 m/s,
  red above 6 m/s - this catalogue's schema only supports one min/max
  "good" band today, so orange is folded into red here (0-5 m/s kept as
  the verified good band) rather than fabricating a maybe-tier that isn't
  really representable yet. This site also has a second, opposite-facing
  launch sector (225-315 deg) not captured by the single from_deg/to_deg
  field below - approximated to the wider of the two real ranges
  (45-145 deg) for now; the reverse-direction launch is real and valid,
  just not yet representable without extending the schema to multiple
  sector ranges.
