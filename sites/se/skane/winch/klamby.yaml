description: >-
  CPS.se klubbfält (winch site). Private field, contact CPS. Launchable
  from either end of the strip depending on wind (45-145deg and
  225-315deg, both real, both represented in sector.ranges above). Real
  usable wind band is a single site-supplied range: green 0-5 m/s, orange
  5-6 m/s, red above 6 m/s - this catalogue's schema only supports one
  min/max "good" band today, so orange is folded into red here (0-5 m/s
  kept as the verified good band) rather than fabricating a maybe-tier
  that isn't really representable yet.
